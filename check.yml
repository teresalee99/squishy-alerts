name: check-listings

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min. GitHub's minimum is 5; delays of a few minutes are normal.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print results + diagnostics, send/save nothing)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: check-listings
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Check listings
        run: python check.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
      - name: Save seen listings
        run: |
          git config user.name "listing-bot"
          git config user.email "listing-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
